<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6C63FF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>영어 단어 퀴즈</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:linear-gradient(135deg,#eef0ff,#fff7e8);min-height:100vh;color:#222}
.app{max-width:520px;margin:auto;min-height:100vh;padding:20px 16px}
header{text-align:center;padding:18px 0}
.logo{font-size:48px}.title{font-size:28px;font-weight:800;margin:5px 0}.sub{color:#666}
.card{background:white;border-radius:24px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.progress{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress>div{height:100%;background:#6C63FF;transition:.3s}
.qnum{color:#6C63FF;font-weight:700;margin-bottom:10px}
.word{font-size:38px;font-weight:900;text-align:center;margin:15px 0 24px}
.question{text-align:center;font-size:19px;font-weight:700;margin-bottom:18px}
.options{display:grid;gap:12px}
button{font:inherit;border:0;cursor:pointer}
.option{background:#f5f5fa;border:2px solid #eee;border-radius:16px;padding:15px;font-size:18px;text-align:left;transition:.15s}
.option:active{transform:scale(.98)}
.option:hover{border-color:#6C63FF}
.option.correct{background:#e8f8ed;border-color:#31a852}
.option.wrong{background:#ffebeb;border-color:#e55353}
.feedback{margin-top:16px;padding:14px;border-radius:14px;background:#f7f7fb;display:none;line-height:1.5}
.next{width:100%;margin-top:14px;background:#6C63FF;color:white;border-radius:16px;padding:16px;font-size:18px;font-weight:800;display:none}
.start{width:100%;background:#6C63FF;color:white;border-radius:18px;padding:17px;font-size:20px;font-weight:800}
.result{text-align:center}
.score{font-size:64px;font-weight:900;color:#6C63FF;margin:15px 0}
.badge{font-size:52px}
.restart{width:100%;background:#6C63FF;color:white;border-radius:16px;padding:16px;font-size:18px;font-weight:800;margin-top:18px}
.hidden{display:none}
.small{font-size:14px;color:#777;margin-top:12px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">📚</div>
  <div class="title">영어 단어 퀴즈</div>
  <div class="sub">초등학교 1학년 수준 · 10문제</div>
</header>

<div id="home" class="card">
  <div style="font-size:22px;font-weight:800;text-align:center;margin-bottom:10px">영어 단어를 얼마나 알고 있을까요?</div>
  <p style="text-align:center;line-height:1.6;color:#666">단어의 뜻을 보고 알맞은 답을 골라 보세요!</p>
  <button class="start" onclick="startQuiz()">퀴즈 시작하기 🚀</button>
  <div class="small" style="text-align:center">정답을 고르면 바로 설명을 볼 수 있어요.</div>
</div>

<div id="quiz" class="card hidden">
  <div class="qnum" id="qnum"></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="word" id="word"></div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next" id="next" onclick="nextQuestion()">다음 문제 →</button>
</div>

<div id="result" class="card result hidden">
  <div class="badge" id="badge">🏆</div>
  <h2>퀴즈 끝!</h2>
  <div class="score"><span id="score">0</span>/10</div>
  <div id="message" style="font-size:19px;font-weight:700"></div>
  <button class="restart" onclick="startQuiz()">다시 풀기 🔄</button>
</div>
</div>

<script>
const quiz = [
 {w:"apple",q:"“apple”의 뜻은 무엇일까요?",o:["사과","바나나","포도","오렌지"],a:0,e:"apple은 ‘사과’라는 뜻이에요."},
 {w:"happy",q:"“happy”의 뜻은 무엇일까요?",o:["슬픈","화난","행복한","졸린"],a:2,e:"happy는 ‘행복한, 기쁜’이라는 뜻이에요."},
 {w:"dog",q:"“dog”는 무엇을 뜻할까요?",o:["고양이","개","토끼","새"],a:1,e:"dog는 ‘개’라는 뜻이에요."},
 {w:"big",q:"“big”의 뜻은 무엇일까요?",o:["작은","빠른","큰","새로운"],a:2,e:"big은 ‘큰’이라는 뜻이에요."},
 {w:"run",q:"“run”의 뜻은 무엇일까요?",o:["먹다","달리다","자다","읽다"],a:1,e:"run은 ‘달리다’라는 뜻이에요."},
 {w:"book",q:"“book”은 무엇일까요?",o:["책","연필","가방","의자"],a:0,e:"book은 ‘책’이라는 뜻이에요."},
 {w:"cold",q:"“cold”의 뜻은 무엇일까요?",o:["뜨거운","차가운","깨끗한","무거운"],a:1,e:"cold는 ‘차가운, 추운’이라는 뜻이에요."},
 {w:"friend",q:"“friend”의 뜻은 무엇일까요?",o:["선생님","친구","가족","의사"],a:1,e:"friend는 ‘친구’라는 뜻이에요."},
 {w:"jump",q:"“jump”의 뜻은 무엇일까요?",o:["점프하다","앉다","걷다","그리다"],a:0,e:"jump는 ‘뛰다, 점프하다’라는 뜻이에요."},
 {w:"school",q:"“school”은 무엇을 뜻할까요?",o:["공원","학교","병원","가게"],a:1,e:"school은 ‘학교’라는 뜻이에요."}
];

let current=0, score=0, answered=false;

function startQuiz(){
 current=0; score=0;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 showQuestion();
}
function showQuestion(){
 answered=false;
 const x=quiz[current];
 document.getElementById("qnum").textContent=`문제 ${current+1} / ${quiz.length}`;
 document.getElementById("bar").style.width=((current)/quiz.length*100)+"%";
 document.getElementById("word").textContent=x.w;
 document.getElementById("question").textContent=x.q;
 const box=document.getElementById("options");
 box.innerHTML="";
 x.o.forEach((text,i)=>{
   const b=document.createElement("button");
   b.className="option";
   b.textContent=`${String.fromCharCode(65+i)}. ${text}`;
   b.onclick=()=>choose(i,b);
   box.appendChild(b);
 });
 document.getElementById("feedback").style.display="none";
 document.getElementById("next").style.display="none";
}
function choose(i,btn){
 if(answered)return;
 answered=true;
 const x=quiz[current];
 const buttons=[...document.querySelectorAll(".option")];
 buttons.forEach((b,idx)=>{
   b.disabled=true;
   if(idx===x.a)b.classList.add("correct");
 });
 if(i===x.a){
   score++;
   document.getElementById("feedback").textContent="🎉 정답이에요! "+x.e;
 }else{
   btn.classList.add("wrong");
   document.getElementById("feedback").textContent="아쉬워요! "+x.e;
 }
 document.getElementById("feedback").style.display="block";
 document.getElementById("next").style.display="block";
 document.getElementById("bar").style.width=((current+1)/quiz.length*100)+"%";
}
function nextQuestion(){
 current++;
 if(current<quiz.length) showQuestion();
 else showResult();
}
function showResult(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("score").textContent=score;
 let msg="",badge="🏆";
 if(score===10){msg="완벽해요! 영어 단어 박사예요!";badge="👑";}
 else if(score>=8){msg="정말 잘했어요!";badge="🌟";}
 else if(score>=5){msg="잘했어요! 조금만 더 연습해 봐요!";badge="😊";}
 else {msg="괜찮아요! 다시 도전해 봐요!";badge="💪";}
 document.getElementById("message").textContent=msg;
 document.getElementById("badge").textContent=badge;
}
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
</script>
</body>
</html>
